<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CHAN ĐÊ</title>

    <!-- Google Fonts: Orbitron & Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Spline 3D Viewer CDN (Con AI 3D tương tác) -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js"></script>

    <style>
      /* ==========================================================================
       RESET & METALLIC CHROME THEME
       ========================================================================== */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      :root {
        /* Nền đen tuyền đồng bộ 100% với nền video */
        --bg-dark: #000000;

        /* Tông màu kim loại / thép / chrome / titan */
        --metal-white: #ffffff;
        --metal-chrome: #f1f5f9;
        --metal-silver: #cbd5e1;
        --metal-steel: #94a3b8;
        --metal-slate: #64748b;
        --metal-titan: #334155;
        --metal-dark: #0f172a;

        /* Ánh hào quang kim loại bạc sáng */
        --metal-glow: rgba(226, 232, 240, 0.45);
        --metal-glow-intense: rgba(255, 255, 255, 0.65);

        --font-display: "Orbitron", -apple-system, sans-serif;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg-dark);
        color: var(--metal-chrome);
        font-family: var(--font-display);
        position: relative;
      }

      /* ==========================================================================
       KINETIC GRID CANVAS (HẠT BỤI & LƯỚI ĐỘNG LỰC TƯƠNG TÁC THEO CON TRỎ)
       ========================================================================== */
      #kinetic-grid-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
      }

      /* Lớp phủ điện ảnh tối sâu */
      .screen-overlay {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          transparent 40%,
          rgba(9, 9, 12, 0.78) 100%
        );
      }

      /* ==========================================================================
       BỐ CỤC CHÍNH (2 CỘT: VIDEO LỆCH TRÁI - NÚT THÉP BÊN PHẢI)
       ========================================================================== */
      .main-viewport {
        position: relative;
        z-index: 10;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      /* --------------------------------------------------------------------------
       CỘT TRÁI: VIDEO NGƯỜI SẮT LỆCH HẲN VỀ PHÍA TRÁI
       -------------------------------------------------------------------------- */
      .left-section {
        flex: 1.15;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start; /* Lệch về phía bên trái */
        padding-left: 4vw;
        padding-right: 1.5rem;
        overflow: hidden;
      }

      .video-frame-container {
        position: relative;
        width: 100%;
        max-width: 780px;
        height: 75vh;
        min-height: 480px;
        max-height: 86vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Hào quang kim loại bạc / ánh thép phía sau robot AI */
      .video-ambient-glow {
        position: absolute;
        width: 90%;
        height: 90%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(148, 163, 184, 0.25) 0%,
          rgba(203, 213, 225, 0.15) 45%,
          transparent 75%
        );
        filter: blur(55px);
        z-index: 0;
        pointer-events: none;
        animation: metallic-pulse 6s ease-in-out infinite alternate;
      }

      @keyframes metallic-pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.05);
          opacity: 0.95;
        }
      }

      /* Khung chứa con AI 3D tương tác Spline */
      .ai-model-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
      }

      spline-viewer {
        width: 100%;
        height: 100%;
        background: transparent;
        outline: none;
      }

      spline-viewer::part(badge) {
        display: none !important;
      }

      /* --------------------------------------------------------------------------
       CỘT PHẢI: NÚT BẤM "VÀO GAME ĐÊ" PHONG CÁCH KIM LOẠI / THÉP (METALLIC)
       -------------------------------------------------------------------------- */
      .right-section {
        flex: 0.95;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 5vw 2.5rem 2rem;
        z-index: 10;
      }

      .cta-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ==========================================================================
       NÚT BẤM "VÀO GAME ĐÊ" PHONG CÁCH CYBER HOLOGRAPHIC (ĐỒNG BỘ KINETIC GRID)
       ========================================================================== */
      .cta-container {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Hào quang ánh xanh Neon & sóng radar lan tỏa */
      .button-ambient-wave {
        position: absolute;
        width: 330px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(74, 158, 255, 0.3) 0%,
          rgba(56, 189, 248, 0.12) 50%,
          transparent 75%
        );
        filter: blur(36px);
        pointer-events: none;
        z-index: 0;
        transition: all 0.5s ease;
        animation: pulse-cyber-aura 4s ease-in-out infinite alternate;
      }

      @keyframes pulse-cyber-aura {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.1); opacity: 0.9; }
      }

      .button-radar-ring {
        position: absolute;
        inset: -6px;
        border-radius: 26px;
        border: 1.5px solid rgba(74, 158, 255, 0.45);
        pointer-events: none;
        animation: radar-cyber-expand 3s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
        z-index: 0;
      }

      @keyframes radar-cyber-expand {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.3, 1.55); opacity: 0; }
      }

      /* NÚT BẤM CYBER HOLOGRAPHIC */
      .cyber-game-btn, .metallic-steel-btn {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.25rem 3.2rem;
        border-radius: 20px;
        background: linear-gradient(
          135deg,
          rgba(15, 23, 42, 0.88) 0%,
          rgba(8, 12, 22, 0.96) 100%
        );
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1.5px solid rgba(74, 158, 255, 0.45);
        color: #ffffff;
        text-decoration: none;
        cursor: pointer;
        overflow: hidden;
        box-shadow:
          0 0 25px rgba(74, 158, 255, 0.3),
          0 18px 45px rgba(0, 0, 0, 0.92),
          inset 0 1px 2px rgba(255, 255, 255, 0.4),
          inset 0 0 15px rgba(74, 158, 255, 0.15);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate3d(0, 0, 0);
      }

      /* Viền ánh sáng Neon Cyan / Blue Gradient */
      .btn-cyber-border {
        position: absolute;
        inset: 0;
        border-radius: 20px;
        padding: 1.8px;
        background: linear-gradient(
          135deg,
          #38bdf8 0%,
          rgba(74, 158, 255, 0.4) 30%,
          #818cf8 70%,
          #38bdf8 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Vệt sáng Laser quét ngang khi hover */
      .btn-laser-sheen, .btn-chrome-sheen {
        position: absolute;
        top: -60%;
        left: -80%;
        width: 45%;
        height: 220%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(74, 158, 255, 0.2) 25%,
          rgba(255, 255, 255, 0.85) 50%,
          rgba(56, 189, 248, 0.4) 75%,
          transparent 100%
        );
        transform: rotate(30deg);
        pointer-events: none;
        transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
      }

      /* Đốm sáng Neon theo chuột */
      .btn-cyber-spotlight, .btn-metal-spotlight {
        position: absolute;
        top: var(--mouse-y, 50%);
        left: var(--mouse-x, 50%);
        width: 160px;
        height: 160px;
        background: radial-gradient(
          circle,
          rgba(74, 158, 255, 0.35) 0%,
          rgba(56, 189, 248, 0.15) 50%,
          transparent 70%
        );
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
      }

      /* Khối icon tay cầm game Cyberpunk */
      .btn-cyber-icon-box, .btn-steel-icon-box {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.25) 0%,
          rgba(30, 41, 59, 0.85) 100%
        );
        border: 1px solid rgba(74, 158, 255, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #38bdf8;
        box-shadow:
          0 0 14px rgba(56, 189, 248, 0.4),
          inset 0 1px 1px rgba(255, 255, 255, 0.5);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        z-index: 2;
      }

      .btn-cyber-icon-svg, .btn-steel-icon-svg {
        width: 24px;
        height: 24px;
        stroke: #38bdf8;
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8));
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Chữ "VÀO GAME ĐÊ" Neon Cyan */
      .btn-cyber-label, .btn-metal-label {
        position: relative;
        z-index: 2;
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 900;
        letter-spacing: 4px;
        text-transform: uppercase;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #e0f2fe 40%,
          #38bdf8 80%,
          #0284c7 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.75));
        transition: all 0.3s ease;
      }

      /* Huy hiệu mũi tên chuyển động */
      .btn-arrow-badge {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(74, 158, 255, 0.15);
        border: 1px solid rgba(74, 158, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e0f2fe;
        position: relative;
        z-index: 2;
        transition: all 0.35s ease;
      }

      .btn-arrow-svg {
        width: 18px;
        height: 18px;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Sóng xung kích khi bấm */
      .btn-click-ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        animation: ripple-cyber 0.55s ease-out forwards;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.85) 0%,
          rgba(74, 158, 255, 0.4) 50%,
          transparent 80%
        );
        pointer-events: none;
        z-index: 10;
      }

      @keyframes ripple-cyber {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(3.5); opacity: 0; }
      }

      /* HIỆU ỨNG HOVER & ACTIVE */
      .cyber-game-btn:hover, .metallic-steel-btn:hover {
        border-color: #38bdf8;
        transform: translateY(-3px) scale(1.035);
        box-shadow:
          0 0 35px rgba(56, 189, 248, 0.65),
          0 0 75px rgba(74, 158, 255, 0.35),
          0 25px 50px rgba(0, 0, 0, 0.95),
          inset 0 1px 2px rgba(255, 255, 255, 0.8),
          inset 0 0 25px rgba(56, 189, 248, 0.3);
      }

      .cyber-game-btn:hover .btn-laser-sheen,
      .metallic-steel-btn:hover .btn-chrome-sheen {
        opacity: 1;
        transform: translateX(480px) rotate(30deg);
      }

      .cyber-game-btn:hover .btn-cyber-spotlight,
      .metallic-steel-btn:hover .btn-metal-spotlight {
        opacity: 1;
      }

      .cyber-game-btn:hover .btn-cyber-label,
      .metallic-steel-btn:hover .btn-metal-label {
        letter-spacing: 5px;
        filter: drop-shadow(0 0 20px rgba(56, 189, 248, 1));
      }

      .cyber-game-btn:hover .btn-cyber-icon-box,
      .metallic-steel-btn:hover .btn-steel-icon-box {
        background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        border-color: #ffffff;
        color: #ffffff;
        box-shadow: 0 0 22px rgba(56, 189, 248, 0.8);
        transform: scale(1.08) rotate(-4deg);
      }

      .cyber-game-btn:hover .btn-cyber-icon-box .btn-cyber-icon-svg,
      .metallic-steel-btn:hover .btn-steel-icon-box .btn-steel-icon-svg {
        stroke: #ffffff;
        transform: scale(1.1);
      }

      .cyber-game-btn:hover .btn-arrow-badge {
        background: rgba(56, 189, 248, 0.35);
        border-color: #38bdf8;
        transform: translateX(5px);
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      }

      .cyber-game-btn:hover .btn-arrow-badge .btn-arrow-svg {
        transform: translateX(3px);
      }

      .cyber-game-btn:hover ~ .button-ambient-wave,
      .metallic-steel-btn:hover ~ .button-ambient-wave {
        filter: blur(48px);
        width: 380px;
        height: 170px;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.45) 0%,
          rgba(74, 158, 255, 0.25) 50%,
          transparent 75%
        );
      }

      .cyber-game-btn:active, .metallic-steel-btn:active {
        transform: translateY(2px) scale(0.98);
        box-shadow:
          0 0 20px rgba(56, 189, 248, 0.4),
          0 10px 25px rgba(0, 0, 0, 0.9),
          inset 0 3px 10px rgba(0, 0, 0, 0.8);
      }

      /* ==========================================================================
       RESPONSIVE (MOBILE & TABLET)
       ========================================================================== */
      @media (max-width: 991px) {
        html,
        body {
          overflow-y: auto;
          overflow-x: hidden;
        }

        .main-viewport {
          flex-direction: column;
          height: auto;
          min-height: 100vh;
          padding: 2rem 1rem;
        }

        .left-section {
          flex: none;
          width: 100%;
          height: 54vh;
          min-height: 330px;
          padding: 1rem;
          justify-content: center; /* Trên mobile căn giữa cho cân đối */
        }

        .video-frame-container {
          max-width: 95%;
          height: 100%;
        }

        .right-section {
          flex: none;
          width: 100%;
          height: auto;
          padding: 2.5rem 1.5rem;
        }

        .metallic-steel-btn {
          padding: 1.2rem 2.8rem;
          gap: 1.2rem;
          width: 90%;
          max-width: 350px;
        }

        .btn-metal-label {
          font-size: 1.25rem;
          letter-spacing: 4px;
        }
      }

      @media (max-width: 480px) {
        .left-section {
          height: 50vh;
        }

        .metallic-steel-btn {
          padding: 1.1rem 2rem;
        }

        .btn-metal-label {
          font-size: 1.1rem;
          letter-spacing: 3px;
        }

        .btn-steel-icon-box {
          width: 38px;
          height: 38px;
        }
      }

      /* ==========================================================================
         PRELOADER / MÀN HÌNH LOADING KIM LOẠI
         ========================================================================== */
      .preloader-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    visibility 0.8s;
      }

      .preloader-overlay.loaded {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.04);
        pointer-events: none;
      }

      .preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        max-width: 440px;
        width: 90%;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      /* Vòng xoay năng lượng kim loại */
      .preloader-reactor {
        position: relative;
        width: 92px;
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .reactor-outer-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px dashed rgba(203, 213, 225, 0.35);
        animation: spin-cw 9s linear infinite;
      }

      .reactor-inner-spinner {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #ffffff;
        border-right-color: rgba(203, 213, 225, 0.8);
        border-bottom-color: rgba(148, 163, 184, 0.3);
        animation: spin-cw 1.6s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
      }

      .reactor-core-glow {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(148, 163, 184, 0.2) 60%, transparent 80%);
        filter: blur(6px);
        animation: pulse-core 2s ease-in-out infinite alternate;
      }

      .reactor-center-icon {
        position: relative;
        z-index: 3;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .reactor-svg {
        width: 100%;
        height: 100%;
        fill: #ffffff;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
      }

      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-core {
        0% { transform: scale(0.85); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 1; }
      }

      /* Số phần trăm Chrome nổi khối */
      .preloader-counter {
        display: flex;
        align-items: baseline;
        justify-content: center;
      }

      .load-percent-number {
        font-family: var(--font-display);
        font-size: 2.8rem;
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
      }

      .load-percent-symbol {
        font-family: var(--font-display);
        font-size: 1.3rem;
        font-weight: 800;
        color: rgba(203, 213, 225, 0.85);
        margin-left: 2px;
      }

      /* Thanh tiến trình kim loại */
      .preloader-bar-track {
        width: 100%;
        max-width: 360px;
        height: 8px;
        background: #0f172a;
        border: 1px solid rgba(203, 213, 225, 0.35);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 12px rgba(226, 232, 240, 0.15);
      }

      .preloader-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #64748b 0%, #cbd5e1 45%, #ffffff 85%, #cbd5e1 100%);
        border-radius: 3px;
        position: relative;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.75);
        transition: width 0.1s linear;
      }

      .bar-sheen-light {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 30px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
        animation: bar-sheen-move 1.5s linear infinite;
      }

      @keyframes bar-sheen-move {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(360px); }
      }

      /* Dòng trạng thái nạp dữ liệu */
      .preloader-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        font-family: 'Rajdhani', var(--font-display);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 2px;
        color: #94a3b8;
        text-transform: uppercase;
      }

      .status-pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 8px #ffffff;
        animation: pulse-dot 1.2s ease-in-out infinite alternate;
      }

      @keyframes pulse-dot {
        0% { opacity: 0.3; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <!-- MÀN HÌNH PRELOADER / LOADING KIM LOẠI -->
    <div id="preloader" class="preloader-overlay">
      <div class="preloader-content">
        <!-- Vòng xoay năng lượng kim loại -->

    <!-- ==========================================================================
       JAVASCRIPT: KINETIC GRID ENGINE + ÂM THANH KIM LOẠI + TƯƠNG TÁC CON AI
       ========================================================================== -->
    <script>
      /* --------------------------------------------------------------------------
       1. ÂM THANH TIẾNG KIM LOẠI / TIẾNG SẮT (WEB AUDIO API)
       -------------------------------------------------------------------------- */
      let audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Tiếng tuốt gươm thép / chrome loáng sắc lạnh khi hover
      function playMetalHoverSound() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;

          // Bộ dao động âm kim loại thanh mảnh tần số cao
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = "triangle";
          osc1.frequency.setValueAtTime(1400, ctx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(
            2600,
            ctx.currentTime + 0.14,
          );

          osc2.type = "sine";
          osc2.frequency.setValueAtTime(2800, ctx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(
            4200,
            ctx.currentTime + 0.12,
          );

          gain.gain.setValueAtTime(0.045, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start();
          osc2.start();
          osc1.stop(ctx.currentTime + 0.14);
          osc2.stop(ctx.currentTime + 0.14);
        } catch (e) {}
      }

      // Tiếng va đập thép nặng / búa dập cơ khí kim loại khi click
      function playMetalClickSound() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;

          // Tiếng gõ đanh thép (Clang)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "triangle";
          osc.frequency.setValueAtTime(420, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            80,
            ctx.currentTime + 0.28,
          );

          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);

          // Thêm tiếng vang kim loại
          const oscRing = ctx.createOscillator();
          const ringGain = ctx.createGain();
          oscRing.type = "sine";
          oscRing.frequency.setValueAtTime(1850, ctx.currentTime);
          oscRing.frequency.exponentialRampToValueAtTime(
            600,
            ctx.currentTime + 0.35,
          );

          ringGain.gain.setValueAtTime(0.06, ctx.currentTime);
          ringGain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.35,
          );

          osc.connect(gain);
          oscRing.connect(ringGain);
          gain.connect(ctx.destination);
          ringGain.connect(ctx.destination);

          osc.start();
          oscRing.start();
          osc.stop(ctx.currentTime + 0.28);
          oscRing.stop(ctx.currentTime + 0.35);
        } catch (e) {}
      }

      /* --------------------------------------------------------------------------
       2. KINETIC GRID ENGINE (LƯỚI ĐỘNG LỰC HỌC TƯƠNG TÁC CON TRỎ & SÓNG NĂNG LƯỢNG)
       -------------------------------------------------------------------------- */
      const CELL_SIZE = 55;
      const INFLUENCE_RADIUS = 260;
      const MAX_WARP = 24;
      const DOT_SPACING = 28;
      const LERP_SPEED = 0.08;

      const LINE_BASE = { r: 255, g: 255, b: 255, a: 0.13 };
      const NODE_BASE_RADIUS = 1.8;
      const NODE_ACTIVE_RADIUS = 3.2;

      function lerpN(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpColor(base, active, t) {
        const r = Math.round(lerpN(base.r, active.r, t));
        const g = Math.round(lerpN(base.g, active.g, t));
        const b = Math.round(lerpN(base.b, active.b, t));
        const a = lerpN(base.a, active.a, t);
        return `rgba(${r},${g},${b},${a.toFixed(3)})`;
      }

      const gridTheme = {
        bg: "#09090c",
        lineActive: { r: 74, g: 158, b: 255, a: 0.9 },
        nodeActive: { r: 74, g: 158, b: 255, a: 1.0 },
        glow: "74,158,255",
        ripple: "100,180,255",
      };

      let gridCanvas = null;
      let gridCtx = null;
      let gridW = window.innerWidth;
      let gridH = window.innerHeight;
      const mouse = { x: -9999, y: -9999 };
      const targetMouse = { x: -9999, y: -9999 };
      const ripples = [];
      let gridRaf = null;

      function getWarpedPoint(gx, gy, col, row, mousePt, ripplesList, cols, rows) {
        const edgeMargin = 1.5;
        const colPin = Math.min(col / edgeMargin, (cols - 1 - col) / edgeMargin, 1);
        const rowPin = Math.min(row / edgeMargin, (rows - 1 - row) / edgeMargin, 1);
        const pinFactor = colPin * colPin * rowPin * rowPin;

        const dx = gx - mousePt.x;
        const dy = gy - mousePt.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const proximity = Math.max(0, 1 - dist / INFLUENCE_RADIUS) * pinFactor;

        let rx = 0, ry = 0;
        for (let i = 0; i < ripplesList.length; i++) {
          const r = ripplesList[i];
          const rdx = gx - r.x;
          const rdy = gy - r.y;
          const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
          const waveWidth = 55;
          const diff = rdist - r.radius;
          if (Math.abs(diff) < waveWidth) {
            const strength = (1 - Math.abs(diff) / waveWidth) * r.opacity * 18 * pinFactor;
            const angle = Math.atan2(rdy, rdx);
            const sign = diff < 0 ? -1 : 1;
            rx += Math.cos(angle) * strength * sign * -1;
            ry += Math.sin(angle) * strength * sign * -1;
          }
        }

        if (dist < INFLUENCE_RADIUS && dist > 0 && pinFactor > 0) {
          const t = dist / INFLUENCE_RADIUS;
          const eased = t < 0.01 ? 0 : (1 - t) * (1 - t) * Math.min(1, dist / 60);
          const warpAmt = eased * MAX_WARP * pinFactor;
          const angle = Math.atan2(dy, dx);
          return {
            pt: {
              x: gx - Math.cos(angle) * warpAmt + rx,
              y: gy - Math.sin(angle) * warpAmt + ry,
            },
            proximity,
          };
        }

        return { pt: { x: gx + rx, y: gy + ry }, proximity };
      }

      function drawKineticGrid(now) {
        if (!gridCtx) return;

        gridCtx.clearRect(0, 0, gridW, gridH);

        gridCtx.fillStyle = gridTheme.bg;
        gridCtx.fillRect(0, 0, gridW, gridH);

        // Họa tiết chấm hạt tĩnh
        gridCtx.fillStyle = "rgba(255,255,255,0.05)";
        for (let x = DOT_SPACING / 2; x < gridW; x += DOT_SPACING) {
          for (let y = DOT_SPACING / 2; y < gridH; y += DOT_SPACING) {
            gridCtx.beginPath();
            gridCtx.arc(x, y, 0.7, 0, Math.PI * 2);
            gridCtx.fill();
          }
        }

        // Cập nhật sóng ripple
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          const age = (now - r.born) / 1000;
          r.radius = Math.max(0, age * 400);
          r.opacity = Math.max(0, 1 - age * 1.2);
          if (r.opacity <= 0) ripples.splice(i, 1);
        }

        const cols = Math.max(2, Math.ceil(gridW / CELL_SIZE)) + 1;
        const rows = Math.max(2, Math.ceil(gridH / CELL_SIZE)) + 1;
        const cellW = gridW / (cols - 1);
        const cellH = gridH / (rows - 1);

        const pts = [];
        const prox = [];

        for (let row = 0; row < rows; row++) {
          pts[row] = [];
          prox[row] = [];
          for (let col = 0; col < cols; col++) {
            const { pt, proximity } = getWarpedPoint(
              col * cellW,
              row * cellH,
              col,
              row,
              mouse,
              ripples,
              cols,
              rows,
            );
            pts[row][col] = pt;
            prox[row][col] = proximity;
          }
        }

        // Vẽ đường nối lưới
        const drawSeg = (p1, p2, pr1, pr2) => {
          const avg = (pr1 + pr2) / 2;
          const t = avg * avg * (3 - 2 * avg);
          gridCtx.beginPath();
          gridCtx.moveTo(p1.x, p1.y);
          gridCtx.lineTo(p2.x, p2.y);
          gridCtx.strokeStyle = lerpColor(LINE_BASE, gridTheme.lineActive, t);
          gridCtx.lineWidth = lerpN(0.8, 1.5, t);
          gridCtx.stroke();
        };

        gridCtx.lineCap = "butt";

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols - 1; col++) {
            drawSeg(pts[row][col], pts[row][col + 1], prox[row][col], prox[row][col + 1]);
          }
        }

        for (let col = 0; col < cols; col++) {
          for (let row = 0; row < rows - 1; row++) {
            drawSeg(pts[row][col], pts[row + 1][col], prox[row][col], prox[row + 1][col]);
          }
        }

        // Vẽ các nút giao nhau (nodes)
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const p = pts[row][col];
            const pr = prox[row][col];
            const t = pr * pr * (3 - 2 * pr);
            const r = lerpN(NODE_BASE_RADIUS, NODE_ACTIVE_RADIUS, t);

            if (t > 0.3) {
              const glowR = r + lerpN(0, 6, (t - 0.3) / 0.7);
              const grd = gridCtx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, glowR);
              grd.addColorStop(0, `rgba(${gridTheme.glow},${(t * 0.3).toFixed(3)})`);
              grd.addColorStop(1, `rgba(${gridTheme.glow},0)`);
              gridCtx.beginPath();
              gridCtx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
              gridCtx.fillStyle = grd;
              gridCtx.fill();
            }

            gridCtx.beginPath();
            gridCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
            gridCtx.fillStyle = lerpColor({ r: 255, g: 255, b: 255, a: 0.2 }, gridTheme.nodeActive, t);
            gridCtx.fill();
          }
        }

        // Vẽ vòng tròn sóng lan tỏa (ripple rings)
        for (let i = 0; i < ripples.length; i++) {
          const rp = ripples[i];
          const safeRadius = Math.max(0, rp.radius);
          gridCtx.beginPath();
          gridCtx.arc(rp.x, rp.y, safeRadius, 0, Math.PI * 2);
          gridCtx.strokeStyle = `rgba(${gridTheme.ripple},${(rp.opacity * 0.28).toFixed(3)})`;
          gridCtx.lineWidth = 1.5;
          gridCtx.stroke();
        }
      }

      function animateKineticGrid(now) {
        mouse.x = lerpN(mouse.x, targetMouse.x, LERP_SPEED);
        mouse.y = lerpN(mouse.y, targetMouse.y, LERP_SPEED);

        drawKineticGrid(now);
        gridRaf = requestAnimationFrame(animateKineticGrid);
      }

      function initKineticGrid() {
        gridCanvas = document.getElementById("kinetic-grid-canvas");
        if (!gridCanvas) return;
        gridCtx = gridCanvas.getContext("2d");

        const resize = () => {
          gridW = window.innerWidth;
          gridH = window.innerHeight;
          gridCanvas.width = gridW;
          gridCanvas.height = gridH;
        };

        resize();
        window.addEventListener("resize", resize, { passive: true });

        window.addEventListener("mousemove", (e) => {
          targetMouse.x = e.clientX;
          targetMouse.y = e.clientY;
        }, { passive: true });

        window.addEventListener("click", (e) => {
          ripples.push({
            x: e.clientX,
            y: e.clientY,
            radius: 0,
            opacity: 1,
            born: performance.now(),
          });
        });

        gridRaf = requestAnimationFrame(animateKineticGrid);
      }

      /* --------------------------------------------------------------------------
       XÓA BỎ HOÀN TOÀN WATERMARK "BUILT WITH SPLINE"
       -------------------------------------------------------------------------- */
      function removeSplineBadge() {
        const viewer = document.getElementById("aiSplineViewer");
        if (!viewer) return;

        const purge = () => {
          try {
            const root = viewer.shadowRoot;
            if (root) {
              if (!root.getElementById("spline-no-badge-style")) {
                const style = document.createElement("style");
                style.id = "spline-no-badge-style";
                style.textContent = `
                  #logo, a#logo, [href*="spline.design"], a[href*="spline"], 
                  .spline-watermark, #badge, [class*="watermark"], [class*="logo"] {
                    display: none !important;
                    opacity: 0 !important;
                    visibility: hidden !important;
                    pointer-events: none !important;
                    clip: rect(0, 0, 0, 0) !important;
                    position: absolute !important;
                    left: -9999px !important;
                    transform: scale(0) !important;
                  }
                `;
                root.appendChild(style);
              }
              const logo = root.querySelector('#logo, a[href*="spline.design"], .spline-watermark, [id*="logo"]');
              if (logo) logo.remove();
            }
          } catch (e) {}
        };

        purge();
        const timer = setInterval(purge, 50);
        setTimeout(() => clearInterval(timer), 8000);

        if (viewer.shadowRoot) {
          const obs = new MutationObserver(purge);
          obs.observe(viewer.shadowRoot, { childList: true, subtree: true });
        }
      }

      /* --------------------------------------------------------------------------
       3. PRELOADER & NẠP CON AI 3D SPLINE TƯƠNG TÁC
       -------------------------------------------------------------------------- */
      const splineViewer = document.getElementById("aiSplineViewer");
      const preloader = document.getElementById("preloader");
      const loadPercent = document.getElementById("loadPercent");
      const loadProgressBar = document.getElementById("loadProgressBar");
      const loadStatusText = document.getElementById("loadStatusText");

      let currentPercent = 0;
      let targetPercent = 25;
      let isLoaded = false;

      function finishLoading() {
        if (isLoaded) return;
        isLoaded = true;
        currentPercent = 100;
        targetPercent = 100;
        if (loadPercent) loadPercent.textContent = "100";
        if (loadProgressBar) loadProgressBar.style.width = "100%";
        if (loadStatusText) loadStatusText.textContent = "DỮ LIỆU ĐÃ TẢI THÀNH CÔNG";

        setTimeout(() => {
          if (preloader) {
            preloader.classList.add("loaded");
            setTimeout(() => {
              try { preloader.remove(); } catch (e) {}
            }, 850);
          }
        }, 400);
      }

      // Vòng lặp cập nhật tiến trình loading mượt mà
      const loadInterval = setInterval(() => {
        if (isLoaded) {
          clearInterval(loadInterval);
          return;
        }

        // Tăng dần tiến trình để mượt mà trong khi mô hình 3D nạp
        targetPercent = Math.min(95, targetPercent + 0.6);
        currentPercent += (targetPercent - currentPercent) * 0.15;

        const displayVal = Math.min(100, Math.floor(currentPercent));
        if (loadPercent) loadPercent.textContent = displayVal;
        if (loadProgressBar) loadProgressBar.style.width = `${displayVal}%`;

        if (targetPercent >= 100 && currentPercent >= 99) {
          clearInterval(loadInterval);
          finishLoading();
        }
      }, 30);

      // Khi mô hình 3D Spline tải xong
      if (splineViewer) {
        splineViewer.addEventListener("load", () => {
          removeSplineBadge();
          targetPercent = 100;
          finishLoading();
        });
      }

      // Giới hạn an toàn tối đa 4.5s tự động mở trang nếu mạng chậm
      setTimeout(() => {
        if (!isLoaded) {
          targetPercent = 100;
          finishLoading();
        }
      }, 4500);

      // Kích hoạt Audio Context khi người dùng tương tác lần đầu
      const initAudioOnInteraction = () => {
        getAudioContext();
        window.removeEventListener("pointerdown", initAudioOnInteraction);
      };
      window.addEventListener("pointerdown", initAudioOnInteraction, { once: true });

      /* --------------------------------------------------------------------------
       4. NÚT BẤM "VÀO GAME ĐÊ" VẬT LÝ KIM LOẠI & LỰC HÚT MAGNETIC
       -------------------------------------------------------------------------- */
      const ctaButton = document.getElementById("ctaButton");
      const btnSpotlight = document.getElementById("btnSpotlight");

      if (ctaButton) {
        ctaButton.addEventListener("mouseenter", () => {
          playMetalHoverSound();
        });

        ctaButton.addEventListener("click", (e) => {
          playMetalClickSound();

          // Hiệu ứng sóng xung kích bạc khi đập vào nút thép
          const rect = ctaButton.getBoundingClientRect();
          const diameter = Math.max(rect.width, rect.height) * 1.5;
          const radius = diameter / 2;

          const ripple = document.createElement("span");
          ripple.className = "btn-click-ripple";
          ripple.style.width = ripple.style.height = `${diameter}px`;
          ripple.style.left = `${e.clientX - rect.left - radius}px`;
          ripple.style.top = `${e.clientY - rect.top - radius}px`;

          const existingRipple = ctaButton.querySelector(".btn-click-ripple");
          if (existingRipple) existingRipple.remove();

          ctaButton.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        });

        // Lực hút magnetic pull & di chuyển spotlight kim loại
        ctaButton.addEventListener("mousemove", (e) => {
          const rect = ctaButton.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          ctaButton.style.setProperty("--mouse-x", `${x}px`);
          ctaButton.style.setProperty("--mouse-y", `${y}px`);

          if (window.innerWidth > 991) {
            const moveX = (x - rect.width / 2) * 0.28;
            const moveY = (y - rect.height / 2) * 0.28;
            ctaButton.style.transform = `translate3d(${moveX}px, ${moveY - 3}px, 0) scale(1.03)`;
          }
        });

        ctaButton.addEventListener("mouseleave", () => {
          ctaButton.style.transform = "translate3d(0, 0, 0) scale(1)";
        });
      }

      // Khởi chạy khi DOM sẵn sàng
      window.addEventListener("DOMContentLoaded", () => {
        initKineticGrid();
        removeSplineBadge();
      });
    </script>
