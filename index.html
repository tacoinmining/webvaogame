<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CHAN ĐÊ</title>

    <!-- Google Fonts: Orbitron & Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
      /* ==========================================================================
       RESET & METALLIC CHROME THEME
       ========================================================================== */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      :root {
        /* Nền đen tuyền đồng bộ 100% với nền video */
        --bg-dark: #000000;

        /* Tông màu kim loại / thép / chrome / titan */
        --metal-white: #ffffff;
        --metal-chrome: #f1f5f9;
        --metal-silver: #cbd5e1;
        --metal-steel: #94a3b8;
        --metal-slate: #64748b;
        --metal-titan: #334155;
        --metal-dark: #0f172a;

        /* Ánh hào quang kim loại bạc sáng */
        --metal-glow: rgba(226, 232, 240, 0.45);
        --metal-glow-intense: rgba(255, 255, 255, 0.65);

        --font-display: "Orbitron", -apple-system, sans-serif;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg-dark);
        color: var(--metal-chrome);
        font-family: var(--font-display);
        position: relative;
      }

      /* ==========================================================================
       THREE.JS WEBGL CANVAS (HẠT BỤI KIM LOẠI & LƯỚI THÉP KHÔNG GIAN)
       ========================================================================== */
      #webgl-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
      }

      /* Lớp phủ điện ảnh tối sâu */
      .screen-overlay {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          transparent 35%,
          rgba(0, 0, 0, 0.8) 100%
        );
      }

      /* ==========================================================================
       BỐ CỤC CHÍNH (2 CỘT: VIDEO LỆCH TRÁI - NÚT THÉP BÊN PHẢI)
       ========================================================================== */
      .main-viewport {
        position: relative;
        z-index: 10;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      /* --------------------------------------------------------------------------
       CỘT TRÁI: VIDEO NGƯỜI SẮT LỆCH HẲN VỀ PHÍA TRÁI
       -------------------------------------------------------------------------- */
      .left-section {
        flex: 1.15;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start; /* Lệch về phía bên trái */
        padding-left: 4vw;
        padding-right: 1.5rem;
        overflow: hidden;
      }

      .video-frame-container {
        position: relative;
        width: 100%;
        max-width: 720px;
        aspect-ratio: 4 / 3;
        max-height: 86vh;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1200px;
      }

      /* Hào quang kim loại bạc / ánh thép phía sau người sắt */
      .video-ambient-glow {
        position: absolute;
        width: 85%;
        height: 85%;
        background: radial-gradient(
          circle at 45% 50%,
          rgba(148, 163, 184, 0.22) 0%,
          rgba(203, 213, 225, 0.15) 45%,
          transparent 75%
        );
        filter: blur(55px);
        z-index: 0;
        pointer-events: none;
        animation: metallic-pulse 6s ease-in-out infinite alternate;
      }

      @keyframes metallic-pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.05);
          opacity: 0.95;
        }
      }

      /* Khung nghiêng 3D parallax theo chuột */
      .video-tilt-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 1;
      }

      /* Video người sắt: Nền đồng bộ tuyệt đối với trang web (#000000) */
      .metal-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        border-radius: 20px;
        background-color: #000000;

        /* Hòa trộn mép video mượt mà vào nền đen tuyền */
        mask-image: radial-gradient(
          ellipse 94% 92% at 50% 50%,
          #000 65%,
          rgba(0, 0, 0, 0.9) 78%,
          rgba(0, 0, 0, 0.3) 90%,
          transparent 100%
        );
        -webkit-mask-image: radial-gradient(
          ellipse 94% 92% at 50% 50%,
          #000 65%,
          rgba(0, 0, 0, 0.9) 78%,
          rgba(0, 0, 0, 0.3) 90%,
          transparent 100%
        );

        filter: contrast(1.05) brightness(1.03);
      }

      .video-error-badge {
        display: none;
        position: absolute;
        background: rgba(220, 38, 38, 0.2);
        border: 1px solid rgba(239, 68, 68, 0.5);
        padding: 1rem 1.5rem;
        border-radius: 8px;
        color: #fca5a5;
        font-size: 0.9rem;
        text-align: center;
        z-index: 10;
        backdrop-filter: blur(10px);
      }

      /* --------------------------------------------------------------------------
       CỘT PHẢI: NÚT BẤM "VÀO GAME ĐÊ" PHONG CÁCH KIM LOẠI / THÉP (METALLIC)
       -------------------------------------------------------------------------- */
      .right-section {
        flex: 0.95;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 5vw 2.5rem 2rem;
        z-index: 10;
      }

      .cta-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Hào quang ánh kim & sóng radar thép sau nút */
      .button-ambient-wave {
        position: absolute;
        width: 300px;
        height: 130px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(226, 232, 240, 0.3) 0%,
          rgba(148, 163, 184, 0.15) 50%,
          transparent 70%
        );
        filter: blur(32px);
        pointer-events: none;
        z-index: 0;
        transition: all 0.5s ease;
      }

      .button-radar-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 14px;
        border: 1px solid rgba(203, 213, 225, 0.3);
        pointer-events: none;
        animation: radar-metal-expand 3s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
        z-index: 0;
      }

      @keyframes radar-metal-expand {
        0% {
          transform: scale(1);
          opacity: 0.75;
        }
        100% {
          transform: scale(1.38, 1.65);
          opacity: 0;
        }
      }

      /* SIÊU PHẨM NÚT BẤM KIM LOẠI / THÉP BRUSHED STEEL & CHROME */
      .metallic-steel-btn {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.4rem 3.6rem;

        /* Vân bề mặt thép phay xước (Brushed Steel Plate) */
        background:
          repeating-linear-gradient(
            65deg,
            rgba(255, 255, 255, 0.025) 0px,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px,
            transparent 4px
          ),
          linear-gradient(
            135deg,
            #1e293b 0%,
            #0f172a 40%,
            #1e293b 75%,
            #334155 100%
          );

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        /* Vát cạnh tấm kim loại công nghiệp */
        clip-path: polygon(
          18px 0%,
          calc(100% - 18px) 0%,
          100% 18px,
          100% calc(100% - 18px),
          calc(100% - 18px) 100%,
          18px 100%,
          0% calc(100% - 18px),
          0% 18px
        );

        /* Viền kim loại 3D nổi khối */
        border: 1.5px solid rgba(203, 213, 225, 0.45);
        color: #ffffff;
        text-decoration: none;
        cursor: pointer;
        overflow: hidden;

        /* Đổ bóng kim loại nặng và ánh sáng thép */
        box-shadow:
          0 0 25px rgba(226, 232, 240, 0.22),
          0 20px 45px rgba(0, 0, 0, 0.95),
          inset 0 1px 1px rgba(255, 255, 255, 0.6),
          inset 0 -2px 6px rgba(0, 0, 0, 0.7);

        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate3d(0, 0, 0);
      }

      /* Viền Chrome phản quang đa chiều */
      .metallic-steel-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        clip-path: polygon(
          18px 0%,
          calc(100% - 18px) 0%,
          100% 18px,
          100% calc(100% - 18px),
          calc(100% - 18px) 100%,
          18px 100%,
          0% calc(100% - 18px),
          0% 18px
        );
        padding: 1.8px;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #94a3b8 25%,
          #334155 50%,
          #cbd5e1 75%,
          #ffffff 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }

      /* Đinh tán kim loại 4 góc (Industrial Rivets) */
      .metal-rivet {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #ffffff 0%,
          #94a3b8 50%,
          #0f172a 100%
        );
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        z-index: 3;
        pointer-events: none;
      }

      .rivet-tl {
        top: 7px;
        left: 22px;
      }
      .rivet-tr {
        top: 7px;
        right: 22px;
      }
      .rivet-bl {
        bottom: 7px;
        left: 22px;
      }
      .rivet-br {
        bottom: 7px;
        right: 22px;
      }

      /* Vệt sáng chrome loáng kim loại quét ngang (Specular Chrome Sheen) */
      .btn-chrome-sheen {
        position: absolute;
        top: -60%;
        left: -80%;
        width: 45%;
        height: 220%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.15) 30%,
          rgba(255, 255, 255, 0.75) 50%,
          rgba(203, 213, 225, 0.3) 70%,
          transparent 100%
        );
        transform: rotate(30deg);
        pointer-events: none;
        transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
      }

      /* Đốm sáng bạc rọi theo con trỏ chuột */
      .btn-metal-spotlight {
        position: absolute;
        top: var(--mouse-y, 50%);
        left: var(--mouse-x, 50%);
        width: 150px;
        height: 150px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.35) 0%,
          rgba(203, 213, 225, 0.15) 50%,
          transparent 70%
        );
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
      }

      /* Chữ "VÀO GAME ĐÊ" đúc thép Chrome nổi khối */
      .btn-metal-label {
        position: relative;
        z-index: 2;
        font-family: var(--font-display);
        font-size: 1.45rem;
        font-weight: 900;
        letter-spacing: 5px;
        text-transform: uppercase;

        /* Đổ bóng & ánh kim khắc trên thép */
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #f1f5f9 35%,
          #cbd5e1 65%,
          #94a3b8 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9))
          drop-shadow(0 0 12px rgba(255, 255, 255, 0.45));
        transition: all 0.3s ease;
      }

      /* Hộp biểu tượng mũi tên bằng thép đánh bóng */
      .btn-steel-icon-box {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          rgba(51, 65, 85, 0.85) 0%,
          rgba(15, 23, 42, 0.95) 100%
        );
        border: 1px solid rgba(226, 232, 240, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow:
          0 4px 10px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        overflow: hidden;
        z-index: 2;
      }

      .btn-steel-icon-svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Sóng xung kích kim loại khi nhấn */
      .btn-click-ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        animation: ripple-steel 0.55s ease-out forwards;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.8) 0%,
          rgba(203, 213, 225, 0.4) 50%,
          transparent 80%
        );
        pointer-events: none;
        z-index: 10;
      }

      @keyframes ripple-steel {
        0% {
          transform: scale(0);
          opacity: 1;
        }
        100% {
          transform: scale(3.5);
          opacity: 0;
        }
      }

      /* ==========================================================================
       HIỆU ỨNG HOVER & ACTIVE (CẢM GIÁC THÉP NẶNG & CHROME SẮC LẠNH)
       ========================================================================== */
      .metallic-steel-btn:hover {
        border-color: #ffffff;
        transform: translateY(-3px) scale(1.03);
        box-shadow:
          0 0 35px rgba(255, 255, 255, 0.45),
          0 0 70px rgba(148, 163, 184, 0.35),
          0 25px 50px rgba(0, 0, 0, 0.95),
          inset 0 1px 2px rgba(255, 255, 255, 0.8),
          inset 0 0 25px rgba(203, 213, 225, 0.2);
      }

      .metallic-steel-btn:hover .btn-chrome-sheen {
        opacity: 1;
        transform: translateX(480px) rotate(30deg);
      }

      .metallic-steel-btn:hover .btn-metal-spotlight {
        opacity: 1;
      }

      .metallic-steel-btn:hover .btn-metal-label {
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 1))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.75));
        letter-spacing: 6px;
      }

      .metallic-steel-btn:hover .btn-steel-icon-box {
        background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
        border-color: #ffffff;
        color: #0f172a;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        transform: translateX(4px);
      }

      .metallic-steel-btn:hover .btn-steel-icon-box .btn-steel-icon-svg {
        stroke: #0f172a;
        transform: translateX(3px) scale(1.1);
        filter: none;
      }

      .metallic-steel-btn:hover ~ .button-ambient-wave {
        filter: blur(40px);
        width: 360px;
        height: 160px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.4) 0%,
          rgba(148, 163, 184, 0.25) 50%,
          transparent 75%
        );
      }

      /* Hiệu ứng khi bấm (Cảm giác búa gõ / dập thủy lực) */
      .metallic-steel-btn:active {
        transform: translateY(2px) scale(0.98);
        box-shadow:
          0 0 20px rgba(255, 255, 255, 0.3),
          0 10px 25px rgba(0, 0, 0, 0.9),
          inset 0 3px 10px rgba(0, 0, 0, 0.8);
      }

      /* ==========================================================================
       RESPONSIVE (MOBILE & TABLET)
       ========================================================================== */
      @media (max-width: 991px) {
        html,
        body {
          overflow-y: auto;
          overflow-x: hidden;
        }

        .main-viewport {
          flex-direction: column;
          height: auto;
          min-height: 100vh;
          padding: 2rem 1rem;
        }

        .left-section {
          flex: none;
          width: 100%;
          height: 54vh;
          min-height: 330px;
          padding: 1rem;
          justify-content: center; /* Trên mobile căn giữa cho cân đối */
        }

        .video-frame-container {
          max-width: 95%;
          height: 100%;
        }

        .right-section {
          flex: none;
          width: 100%;
          height: auto;
          padding: 2.5rem 1.5rem;
        }

        .metallic-steel-btn {
          padding: 1.2rem 2.8rem;
          gap: 1.2rem;
          width: 90%;
          max-width: 350px;
        }

        .btn-metal-label {
          font-size: 1.25rem;
          letter-spacing: 4px;
        }
      }

      @media (max-width: 480px) {
        .left-section {
          height: 50vh;
        }

        .metallic-steel-btn {
          padding: 1.1rem 2rem;
        }

        .btn-metal-label {
          font-size: 1.1rem;
          letter-spacing: 3px;
        }

        .btn-steel-icon-box {
          width: 38px;
          height: 38px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Three.js Background Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Lớp phủ điện ảnh chiều sâu -->
    <div class="screen-overlay"></div>

    <!-- BỐ CỤC 2 CỘT: TRÁI (VIDEO NGƯỜI SẮT LỆCH TRÁI) - PHẢI (NÚT VÀO GAME ĐÊ TÔNG THÉP) -->
    <main class="main-viewport">
      <!-- CỘT BÊN TRÁI: VIDEO NGƯỜI KIM LOẠI LỆCH HẲN VỀ PHÍA TRÁI -->
      <section class="left-section">
        <div class="video-frame-container" id="videoContainer">
          <!-- Vầng hào quang ánh kim phía sau người sắt -->
          <div class="video-ambient-glow"></div>

          <!-- Khung 3D Tilt Wrapper theo chuột -->
          <div class="video-tilt-wrapper" id="videoTiltWrapper">
            <video
              id="metalHumanVideo"
              class="metal-video"
              src="metal-human.mp4"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
            ></video>

            <div class="video-error-badge" id="videoErrorBadge">
              ⚠️ <strong>Chưa tìm thấy video!</strong><br />
              Hãy đảm bảo file <code>metal-human.mp4</code> nằm cùng thư mục với
              <code>index.html</code>.
            </div>
          </div>
        </div>
      </section>

      <!-- CỘT BÊN PHẢI: NÚT BẤM "VÀO GAME ĐÊ" CÙNG TÔNG THÉP / SẮT NẰM CHÍNH GIỮA NỬA PHẢI -->
      <section class="right-section">
        <div class="cta-container" id="ctaContainer">
          <!-- Hào quang thép & sóng radar -->
          <div class="button-radar-ring"></div>
          <div class="button-ambient-wave"></div>

          <!-- NÚT BẤM "VÀO GAME ĐÊ" TÔNG MÀU NGƯỜI SẮT / BRUSHED STEEL -->
          <!-- Bạn có thể thay đổi đường link website đích ở href bên dưới -->
          <a
            href="https://tank-l1rl.onrender.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="metallic-steel-btn"
            id="ctaButton"
          >
            <!-- Đinh tán công nghiệp 4 góc -->
            <span class="metal-rivet rivet-tl"></span>
            <span class="metal-rivet rivet-tr"></span>
            <span class="metal-rivet rivet-bl"></span>
            <span class="metal-rivet rivet-br"></span>

            <!-- Vệt sáng Chrome loáng kim loại khi hover -->
            <span class="btn-chrome-sheen"></span>

            <!-- Đốm sáng bạc theo con trỏ chuột -->
            <span class="btn-metal-spotlight" id="btnSpotlight"></span>

            <!-- Chữ "VÀO GAME ĐÊ" đúc thép Chrome nổi bật -->
            <span class="btn-metal-label">VÀO GAME ĐÊ</span>

            <!-- Khối icon mũi tên thép đánh bóng -->
            <span class="btn-steel-icon-box">
              <svg class="btn-steel-icon-svg" viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
          </a>
        </div>
      </section>
    </main>

    <!-- ==========================================================================
       JAVASCRIPT: THREE.JS BỤI KIM LOẠI + ÂM THANH TIẾNG THÉP + TƯƠNG TÁC
       ========================================================================== -->
    <script>
      /* --------------------------------------------------------------------------
       1. ÂM THANH TIẾNG KIM LOẠI / TIẾNG SẮT (WEB AUDIO API)
       -------------------------------------------------------------------------- */
      let audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Tiếng tuốt gươm thép / chrome loáng sắc lạnh khi hover
      function playMetalHoverSound() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;

          // Bộ dao động âm kim loại thanh mảnh tần số cao
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = "triangle";
          osc1.frequency.setValueAtTime(1400, ctx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(
            2600,
            ctx.currentTime + 0.14,
          );

          osc2.type = "sine";
          osc2.frequency.setValueAtTime(2800, ctx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(
            4200,
            ctx.currentTime + 0.12,
          );

          gain.gain.setValueAtTime(0.045, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start();
          osc2.start();
          osc1.stop(ctx.currentTime + 0.14);
          osc2.stop(ctx.currentTime + 0.14);
        } catch (e) {}
      }

      // Tiếng va đập thép nặng / búa dập cơ khí kim loại khi click
      function playMetalClickSound() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;

          // Tiếng gõ đanh thép (Clang)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "triangle";
          osc.frequency.setValueAtTime(420, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            80,
            ctx.currentTime + 0.28,
          );

          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);

          // Thêm tiếng vang kim loại
          const oscRing = ctx.createOscillator();
          const ringGain = ctx.createGain();
          oscRing.type = "sine";
          oscRing.frequency.setValueAtTime(1850, ctx.currentTime);
          oscRing.frequency.exponentialRampToValueAtTime(
            600,
            ctx.currentTime + 0.35,
          );

          ringGain.gain.setValueAtTime(0.06, ctx.currentTime);
          ringGain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.35,
          );

          osc.connect(gain);
          oscRing.connect(ringGain);
          gain.connect(ctx.destination);
          ringGain.connect(ctx.destination);

          osc.start();
          oscRing.start();
          osc.stop(ctx.currentTime + 0.28);
          oscRing.stop(ctx.currentTime + 0.35);
        } catch (e) {}
      }

      /* --------------------------------------------------------------------------
       2. THREE.JS: HẠT BỤI SAO KIM LOẠI & LƯỚI KHÔNG GIAN BẠC
       -------------------------------------------------------------------------- */
      const canvas = document.getElementById("webgl-canvas");
      let scene, camera, renderer;
      let particleSystem, gridMesh;
      let windowHalfX = window.innerWidth / 2;
      let windowHalfY = window.innerHeight / 2;

      let mouseX = 0;
      let mouseY = 0;
      let targetMouseX = 0;
      let targetMouseY = 0;

      // Hạt ánh kim bạc / chrome lơ lửng
      function createMetallicParticleTexture() {
        const pCanvas = document.createElement("canvas");
        pCanvas.width = 64;
        pCanvas.height = 64;
        const ctx = pCanvas.getContext("2d");

        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
        gradient.addColorStop(0.25, "rgba(226, 232, 240, 0.85)");
        gradient.addColorStop(0.55, "rgba(148, 163, 184, 0.35)");
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);

        const texture = new THREE.CanvasTexture(pCanvas);
        texture.needsUpdate = true;
        return texture;
      }

      function initThree() {
        scene = new THREE.Scene();

        // Sương mù đen tuyền (#000000) hòa hợp tuyệt đối với video
        scene.fog = new THREE.FogExp2(0x000000, 0.0012);

        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          1,
          3000,
        );
        camera.position.z = 850;

        renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          alpha: true,
          antialias: true,
          powerPreference: "high-performance",
        });
        renderer.setClearColor(0x000000, 1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Hạt bụi kim loại / tinh thể thép trong không gian 3D
        const particleCount = 2000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const originalY = new Float32Array(particleCount);

        // Bảng màu bạc / thép / chrome / trắng tinh
        const metallicPalette = [
          new THREE.Color(0xffffff), // Bạch kim sáng
          new THREE.Color(0xe2e8f0), // Bạc sáng
          new THREE.Color(0xcbd5e1), // Thép chrome
          new THREE.Color(0x94a3b8), // Titan xám
        ];

        for (let i = 0; i < particleCount; i++) {
          const i3 = i * 3;
          positions[i3] = (Math.random() - 0.5) * 2200;
          const yVal = (Math.random() - 0.5) * 1600;
          positions[i3 + 1] = yVal;
          originalY[i] = yVal;
          positions[i3 + 2] = (Math.random() - 0.5) * 2000;

          const col =
            metallicPalette[Math.floor(Math.random() * metallicPalette.length)];
          colors[i3] = col.r;
          colors[i3 + 1] = col.g;
          colors[i3 + 2] = col.b;
        }

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
          size: 8.5,
          map: createMetallicParticleTexture(),
          vertexColors: true,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        particleSystem = new THREE.Points(geometry, particleMaterial);
        particleSystem.userData = { originalY: originalY };
        scene.add(particleSystem);

        // Lưới không gian màu xám thép mờ ảo
        const gridWidth = 1400;
        const gridDepth = 1400;
        const gridSegments = 40;
        const gridGeo = new THREE.PlaneGeometry(
          gridWidth,
          gridDepth,
          gridSegments,
          gridSegments,
        );
        gridGeo.rotateX(-Math.PI / 2);

        const gridMat = new THREE.MeshBasicMaterial({
          color: 0x94a3b8,
          wireframe: true,
          transparent: true,
          opacity: 0.05,
        });

        gridMesh = new THREE.Mesh(gridGeo, gridMat);
        gridMesh.position.y = -350;
        scene.add(gridMesh);

        // Lắng nghe tương tác
        window.addEventListener("resize", onWindowResize, { passive: true });
        document.addEventListener("mousemove", onDocumentMouseMove, {
          passive: true,
        });
        document.addEventListener("touchmove", onDocumentTouchMove, {
          passive: true,
        });
      }

      function onWindowResize() {
        windowHalfX = window.innerWidth / 2;
        windowHalfY = window.innerHeight / 2;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onDocumentMouseMove(e) {
        targetMouseX = (e.clientX - windowHalfX) * 0.45;
        targetMouseY = (e.clientY - windowHalfY) * 0.45;
      }

      function onDocumentTouchMove(e) {
        if (e.touches.length > 0) {
          targetMouseX = (e.touches[0].clientX - windowHalfX) * 0.3;
          targetMouseY = (e.touches[0].clientY - windowHalfY) * 0.3;
        }
      }

      let clock = new THREE.Clock();

      function animateThree() {
        requestAnimationFrame(animateThree);

        const elapsedTime = clock.getElapsedTime();

        // Camera Parallax mượt mà
        mouseX += (targetMouseX - mouseX) * 0.05;
        mouseY += (targetMouseY - mouseY) * 0.05;

        camera.position.x = mouseX;
        camera.position.y = -mouseY + 20;
        camera.lookAt(0, 0, 0);

        // Xoay nhẹ đám mây hạt kim loại
        if (particleSystem) {
          particleSystem.rotation.y = elapsedTime * 0.025;
          particleSystem.rotation.x = Math.sin(elapsedTime * 0.02) * 0.06;

          const posAttr = particleSystem.geometry.attributes.position;
          const origY = particleSystem.userData.originalY;
          for (let i = 0; i < origY.length; i += 2) {
            posAttr.array[i * 3 + 1] =
              origY[i] + Math.sin(elapsedTime * 1.5 + i) * 16;
          }
          posAttr.needsUpdate = true;
        }

        // Sóng dập dờn của lưới thép
        if (gridMesh) {
          const positions = gridMesh.geometry.attributes.position;
          for (let i = 0; i < positions.count; i++) {
            const u = positions.getX(i);
            const v = positions.getZ(i);
            const wave =
              Math.sin(u * 0.008 + elapsedTime * 1.6) *
              Math.cos(v * 0.008 + elapsedTime * 1.4) *
              20;
            positions.setY(i, wave);
          }
          positions.needsUpdate = true;
          gridMesh.position.z = (elapsedTime * 40) % (1400 / 40);
        }

        renderer.render(scene, camera);
      }

      /* --------------------------------------------------------------------------
       3. VIDEO NGƯỜI SẮT & TỰ ĐỘNG CÂN BẰNG TỶ LỆ KHUNG HÌNH
       -------------------------------------------------------------------------- */
      const video = document.getElementById("metalHumanVideo");
      const videoTiltWrapper = document.getElementById("videoTiltWrapper");
      const videoContainer = document.getElementById("videoContainer");
      const videoErrorBadge = document.getElementById("videoErrorBadge");

      if (video) {
        video.addEventListener("loadedmetadata", () => {
          if (video.videoWidth && video.videoHeight && videoContainer) {
            videoContainer.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
          }
        });

        video.addEventListener("error", () => {
          if (videoErrorBadge) videoErrorBadge.style.display = "block";
        });

        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            video.muted = true;
            video.play().catch(() => {});
          });
        }

        const resumeMedia = () => {
          if (video.paused) {
            video.play().catch(() => {});
          }
          getAudioContext();
          window.removeEventListener("pointerdown", resumeMedia);
        };
        window.addEventListener("pointerdown", resumeMedia, { once: true });
      }

      // Nghiêng 3D parallax theo chuột trên Desktop
      if (videoContainer && videoTiltWrapper && window.innerWidth > 991) {
        window.addEventListener(
          "mousemove",
          (e) => {
            const rect = videoContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const deltaX = (e.clientX - centerX) / (window.innerWidth / 2);
            const deltaY = (e.clientY - centerY) / (window.innerHeight / 2);

            const tiltX = -deltaY * 6;
            const tiltY = deltaX * 8;

            videoTiltWrapper.style.transform = `perspective(1000px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg) translateZ(10px)`;
          },
          { passive: true },
        );
      }

      /* --------------------------------------------------------------------------
       4. NÚT BẤM "VÀO GAME ĐÊ" VẬT LÝ KIM LOẠI & LỰC HÚT MAGNETIC
       -------------------------------------------------------------------------- */
      const ctaButton = document.getElementById("ctaButton");
      const btnSpotlight = document.getElementById("btnSpotlight");

      if (ctaButton) {
        ctaButton.addEventListener("mouseenter", () => {
          playMetalHoverSound();
        });

        ctaButton.addEventListener("click", (e) => {
          playMetalClickSound();

          // Hiệu ứng sóng xung kích bạc khi đập vào nút thép
          const rect = ctaButton.getBoundingClientRect();
          const diameter = Math.max(rect.width, rect.height) * 1.5;
          const radius = diameter / 2;

          const ripple = document.createElement("span");
          ripple.className = "btn-click-ripple";
          ripple.style.width = ripple.style.height = `${diameter}px`;
          ripple.style.left = `${e.clientX - rect.left - radius}px`;
          ripple.style.top = `${e.clientY - rect.top - radius}px`;

          const existingRipple = ctaButton.querySelector(".btn-click-ripple");
          if (existingRipple) existingRipple.remove();

          ctaButton.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        });

        // Lực hút magnetic pull & di chuyển spotlight kim loại
        ctaButton.addEventListener("mousemove", (e) => {
          const rect = ctaButton.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          ctaButton.style.setProperty("--mouse-x", `${x}px`);
          ctaButton.style.setProperty("--mouse-y", `${y}px`);

          if (window.innerWidth > 991) {
            const moveX = (x - rect.width / 2) * 0.28;
            const moveY = (y - rect.height / 2) * 0.28;
            ctaButton.style.transform = `translate3d(${moveX}px, ${moveY - 3}px, 0) scale(1.03)`;
          }
        });

        ctaButton.addEventListener("mouseleave", () => {
          ctaButton.style.transform = "translate3d(0, 0, 0) scale(1)";
        });
      }

      // Khởi chạy khi DOM sẵn sàng
      window.addEventListener("DOMContentLoaded", () => {
        initThree();
        animateThree();
      });
    </script>
  </body>
</html>
