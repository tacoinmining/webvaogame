<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>VÀO GAME ĐÊ</title>

    <!-- Google Fonts: Orbitron & Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Spline 3D Viewer CDN (Con AI 3D tương tác) -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js"></script>

    <style>
      /* ==========================================================================
       RESET & METALLIC CHROME THEME
       ========================================================================== */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      :root {
        /* Nền đen tuyền đồng bộ 100% với nền video */
        --bg-dark: #000000;

        /* Tông màu kim loại / thép / chrome / titan */
        --metal-white: #ffffff;
        --metal-chrome: #f1f5f9;
        --metal-silver: #cbd5e1;
        --metal-steel: #94a3b8;
        --metal-slate: #64748b;
        --metal-titan: #334155;
        --metal-dark: #0f172a;

        /* Ánh hào quang kim loại bạc sáng */
        --metal-glow: rgba(226, 232, 240, 0.45);
        --metal-glow-intense: rgba(255, 255, 255, 0.65);

        --font-display: "Orbitron", -apple-system, sans-serif;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background-color: var(--bg-dark);
        color: var(--metal-chrome);
        font-family: var(--font-display);
        position: relative;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      /* ==========================================================================
       TUBES CURSOR 3D CANVAS (DẢI MÀU NEON 3D UỐN LƯỢN THEO CON TRỎ CHUỘT)
       ========================================================================== */
      #tubes-cursor-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 0;
        pointer-events: none;
        display: block;
      }

      /* Lớp phủ điện ảnh tối sâu */
      .screen-overlay {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          transparent 40%,
          rgba(9, 9, 12, 0.78) 100%
        );
      }

      /* ==========================================================================
       BỐ CỤC CHÍNH (2 CỘT: ROBOT LỆCH TRÁI SÁT ĐÁY - NÚT THÉP BÊN PHẢI)
       ========================================================================== */
      .main-viewport {
        position: relative;
        z-index: 10;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      /* --------------------------------------------------------------------------
       CỘT TRÁI: CON ROBOT 3D LỆCH TRÁI VÀ SÁT MÉP DƯỚI (KHÔNG MẤT CHÂN)
       -------------------------------------------------------------------------- */
      .left-section {
        flex: 1.18;
        height: 100%;
        position: relative;
        display: flex;
        align-items: flex-end; /* Sát mép dưới để không bị mất chân robot */
        justify-content: flex-start; /* Lệch về phía bên trái */
        padding-left: 2.5vw;
        padding-right: 1rem;
        padding-bottom: 0; /* Ép sát đáy sàn màn hình */
        overflow: hidden;
      }

      .video-frame-container {
        position: relative;
        width: 100%;
        max-width: 860px;
        height: 93vh; /* Chiều cao tối đa để thấy toàn bộ đầu tới chân robot */
        max-height: 98vh;
        display: flex;
        align-items: flex-end; /* Chân robot chạm sát mép dưới */
        justify-content: center;
        margin-bottom: 0;
      }

      /* Hào quang kim loại bạc / ánh thép phía sau robot AI */
      .video-ambient-glow {
        position: absolute;
        width: 85%;
        height: 80%;
        bottom: 5%;
        background: radial-gradient(
          circle at 50% 55%,
          rgba(148, 163, 184, 0.22) 0%,
          rgba(203, 213, 225, 0.12) 45%,
          transparent 75%
        );
        filter: blur(55px);
        z-index: 0;
        pointer-events: none;
        animation: metallic-pulse 6s ease-in-out infinite alternate;
      }

      @keyframes metallic-pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.05);
          opacity: 0.95;
        }
      }

      /* Khung chứa con AI 3D tương tác Spline */
      .ai-model-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 1;
      }

      spline-viewer {
        width: 100%;
        height: 100%;
        background: transparent;
        outline: none;
        display: block;
      }

      spline-viewer::part(badge) {
        display: none !important;
      }

      /* --------------------------------------------------------------------------
       CỘT PHẢI: NÚT BẤM "VÀO GAME ĐÊ" PHONG CÁCH KIM LOẠI / THÉP (METALLIC)
       -------------------------------------------------------------------------- */
      .right-section {
        flex: 0.95;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 5vw 2.5rem 2rem;
        z-index: 10;
      }

      .cta-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ==========================================================================
       NÚT BẤM "VÀO GAME ĐÊ" PHONG CÁCH CYBER HOLOGRAPHIC (ĐỒNG BỘ KINETIC GRID)
       ========================================================================== */
      .cta-container {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        z-index: 25;
      }

      /* Hào quang ánh xanh Neon & sóng radar lan tỏa */
      .button-ambient-wave {
        position: absolute;
        width: 330px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(74, 158, 255, 0.3) 0%,
          rgba(56, 189, 248, 0.12) 50%,
          transparent 75%
        );
        filter: blur(36px);
        pointer-events: none;
        z-index: 0;
        transition: all 0.5s ease;
        animation: pulse-cyber-aura 4s ease-in-out infinite alternate;
      }

      @keyframes pulse-cyber-aura {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.1); opacity: 0.9; }
      }

      .button-radar-ring {
        position: absolute;
        inset: -6px;
        border-radius: 26px;
        border: 1.5px solid rgba(74, 158, 255, 0.45);
        pointer-events: none;
        animation: radar-cyber-expand 3s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
        z-index: 0;
      }

      @keyframes radar-cyber-expand {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.3, 1.55); opacity: 0; }
      }

      /* NÚT BẤM CYBER HOLOGRAPHIC */
      .cyber-game-btn, .metallic-steel-btn {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.25rem 3.2rem;
        border-radius: 20px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        background: linear-gradient(
          135deg,
          rgba(15, 23, 42, 0.88) 0%,
          rgba(8, 12, 22, 0.96) 100%
        );
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1.5px solid rgba(74, 158, 255, 0.45);
        color: #ffffff;
        text-decoration: none;
        cursor: pointer;
        overflow: hidden;
        box-shadow:
          0 0 25px rgba(74, 158, 255, 0.3),
          0 18px 45px rgba(0, 0, 0, 0.92),
          inset 0 1px 2px rgba(255, 255, 255, 0.4),
          inset 0 0 15px rgba(74, 158, 255, 0.15);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate3d(0, 0, 0);
      }

      /* Viền ánh sáng Neon Cyan / Blue Gradient */
      .btn-cyber-border {
        position: absolute;
        inset: 0;
        border-radius: 20px;
        padding: 1.8px;
        background: linear-gradient(
          135deg,
          #38bdf8 0%,
          rgba(74, 158, 255, 0.4) 30%,
          #818cf8 70%,
          #38bdf8 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Vệt sáng Laser quét ngang khi hover */
      .btn-laser-sheen, .btn-chrome-sheen {
        position: absolute;
        top: -60%;
        left: -80%;
        width: 45%;
        height: 220%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(74, 158, 255, 0.2) 25%,
          rgba(255, 255, 255, 0.85) 50%,
          rgba(56, 189, 248, 0.4) 75%,
          transparent 100%
        );
        transform: rotate(30deg);
        pointer-events: none;
        transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
      }

      /* Đốm sáng Neon theo chuột */
      .btn-cyber-spotlight, .btn-metal-spotlight {
        position: absolute;
        top: var(--mouse-y, 50%);
        left: var(--mouse-x, 50%);
        width: 160px;
        height: 160px;
        background: radial-gradient(
          circle,
          rgba(74, 158, 255, 0.35) 0%,
          rgba(56, 189, 248, 0.15) 50%,
          transparent 70%
        );
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
      }

      /* Khối icon tay cầm game Cyberpunk */
      .btn-cyber-icon-box, .btn-steel-icon-box {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.25) 0%,
          rgba(30, 41, 59, 0.85) 100%
        );
        border: 1px solid rgba(74, 158, 255, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #38bdf8;
        box-shadow:
          0 0 14px rgba(56, 189, 248, 0.4),
          inset 0 1px 1px rgba(255, 255, 255, 0.5);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        z-index: 2;
      }

      .btn-cyber-icon-svg, .btn-steel-icon-svg {
        width: 24px;
        height: 24px;
        stroke: #38bdf8;
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8));
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Chữ "VÀO GAME ĐÊ" Neon Cyan */
      .btn-cyber-label, .btn-metal-label {
        position: relative;
        z-index: 2;
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 900;
        letter-spacing: 4px;
        text-transform: uppercase;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #e0f2fe 40%,
          #38bdf8 80%,
          #0284c7 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.75));
        transition: all 0.3s ease;
      }

      /* Huy hiệu mũi tên chuyển động */
      .btn-arrow-badge {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(74, 158, 255, 0.15);
        border: 1px solid rgba(74, 158, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e0f2fe;
        position: relative;
        z-index: 2;
        transition: all 0.35s ease;
      }

      .btn-arrow-svg {
        width: 18px;
        height: 18px;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Sóng xung kích khi bấm */
      .btn-click-ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        animation: ripple-cyber 0.55s ease-out forwards;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.85) 0%,
          rgba(74, 158, 255, 0.4) 50%,
          transparent 80%
        );
        pointer-events: none;
        z-index: 10;
      }

      @keyframes ripple-cyber {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(3.5); opacity: 0; }
      }

      /* HIỆU ỨNG HOVER & ACTIVE */
      .cyber-game-btn:hover, .metallic-steel-btn:hover {
        border-color: #38bdf8;
        transform: translateY(-3px) scale(1.035);
        box-shadow:
          0 0 35px rgba(56, 189, 248, 0.65),
          0 0 75px rgba(74, 158, 255, 0.35),
          0 25px 50px rgba(0, 0, 0, 0.95),
          inset 0 1px 2px rgba(255, 255, 255, 0.8),
          inset 0 0 25px rgba(56, 189, 248, 0.3);
      }

      .cyber-game-btn:hover .btn-laser-sheen,
      .metallic-steel-btn:hover .btn-chrome-sheen {
        opacity: 1;
        transform: translateX(480px) rotate(30deg);
      }

      .cyber-game-btn:hover .btn-cyber-spotlight,
      .metallic-steel-btn:hover .btn-metal-spotlight {
        opacity: 1;
      }

      .cyber-game-btn:hover .btn-cyber-label,
      .metallic-steel-btn:hover .btn-metal-label {
        letter-spacing: 5px;
        filter: drop-shadow(0 0 20px rgba(56, 189, 248, 1));
      }

      .cyber-game-btn:hover .btn-cyber-icon-box,
      .metallic-steel-btn:hover .btn-steel-icon-box {
        background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        border-color: #ffffff;
        color: #ffffff;
        box-shadow: 0 0 22px rgba(56, 189, 248, 0.8);
        transform: scale(1.08) rotate(-4deg);
      }

      .cyber-game-btn:hover .btn-cyber-icon-box .btn-cyber-icon-svg,
      .metallic-steel-btn:hover .btn-steel-icon-box .btn-steel-icon-svg {
        stroke: #ffffff;
        transform: scale(1.1);
      }

      .cyber-game-btn:hover .btn-arrow-badge {
        background: rgba(56, 189, 248, 0.35);
        border-color: #38bdf8;
        transform: translateX(5px);
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      }

      .cyber-game-btn:hover .btn-arrow-badge .btn-arrow-svg {
        transform: translateX(3px);
      }

      .cyber-game-btn:hover ~ .button-ambient-wave,
      .metallic-steel-btn:hover ~ .button-ambient-wave {
        filter: blur(48px);
        width: 380px;
        height: 170px;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.45) 0%,
          rgba(74, 158, 255, 0.25) 50%,
          transparent 75%
        );
      }

      .cyber-game-btn:active, .metallic-steel-btn:active {
        transform: translateY(2px) scale(0.98);
        box-shadow:
          0 0 20px rgba(56, 189, 248, 0.4),
          0 10px 25px rgba(0, 0, 0, 0.9),
          inset 0 3px 10px rgba(0, 0, 0, 0.8);
      }

      /* ==========================================================================
       RESPONSIVE (MOBILE & TABLET FIX - TỐI ƯU HÓA HOÀN TOÀN CHO ĐIỆN THOẠI)
       ========================================================================== */
      @media (max-width: 991px) {
        html,
        body {
          height: 100vh;
          height: 100dvh;
          overflow: hidden;
          position: fixed;
          width: 100%;
        }

        .main-viewport {
          flex-direction: column;
          justify-content: space-between;
          align-items: center;
          height: 100vh;
          height: 100dvh;
          width: 100vw;
          padding: 0.5rem 1rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
          overflow: hidden;
          position: relative;
          z-index: 10;
        }

        /* Phần hiển thị Robot trên điện thoại: chiếm phần trên và sát đáy */
        .left-section {
          flex: 1;
          width: 100%;
          height: auto;
          min-height: 0;
          max-height: 68vh;
          max-height: 68dvh;
          padding: 0;
          display: flex;
          align-items: flex-end; /* Chân robot sát đáy phần trên, không bị cắt */
          justify-content: center;
          overflow: hidden;
          position: relative;
        }

        .video-frame-container {
          width: 100%;
          max-width: 100%;
          height: 100%;
          max-height: 100%;
          display: flex;
          align-items: flex-end;
          justify-content: center;
          margin-bottom: 0;
        }

        .ai-model-wrapper {
          width: 100%;
          height: 100%;
          display: flex;
          align-items: flex-end;
          justify-content: center;
        }

        .video-ambient-glow {
          width: 90%;
          height: 70%;
          bottom: 0;
        }

        /* Khu vực nút bấm trên điện thoại: gọn gàng ở dưới cùng, dễ chạm */
        .right-section {
          flex: none;
          width: 100%;
          height: auto;
          padding: 0.75rem 0 0.5rem;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 25;
          position: relative;
        }

        .cta-container {
          width: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .button-ambient-wave {
          width: 280px;
          height: 90px;
        }

        /* Nút bấm VÀO GAME ĐÊ vừa vặn trên màn hình điện thoại */
        .cyber-game-btn, .metallic-steel-btn {
          width: 94%;
          max-width: 350px;
          padding: 1rem 1.6rem;
          gap: 0.85rem;
          border-radius: 16px;
          box-shadow:
            0 0 25px rgba(56, 189, 248, 0.45),
            0 12px 30px rgba(0, 0, 0, 0.9);
        }

        .btn-cyber-label, .btn-metal-label {
          font-size: 1.18rem;
          letter-spacing: 2.5px;
        }

        .btn-cyber-icon-box, .btn-steel-icon-box {
          width: 40px;
          height: 40px;
          border-radius: 10px;
          flex-shrink: 0;
        }

        .btn-cyber-icon-svg, .btn-steel-icon-svg {
          width: 20px;
          height: 20px;
        }

        .btn-arrow-badge {
          width: 32px;
          height: 32px;
          border-radius: 8px;
          flex-shrink: 0;
        }

        .btn-arrow-svg {
          width: 16px;
          height: 16px;
        }
      }

      /* Màn hình điện thoại nhỏ (iPhone SE, màn hình < 380px) */
      @media (max-width: 380px) {
        .cyber-game-btn, .metallic-steel-btn {
          padding: 0.85rem 1.1rem;
          gap: 0.6rem;
          width: 98%;
        }

        .btn-cyber-label, .btn-metal-label {
          font-size: 1.05rem;
          letter-spacing: 1.5px;
        }

        .btn-cyber-icon-box, .btn-steel-icon-box {
          width: 34px;
          height: 34px;
        }

        .btn-arrow-badge {
          display: none;
        }
      }

      /* Màn hình điện thoại xoay ngang hoặc chiều cao thấp */
      @media (max-height: 640px) and (max-width: 991px) {
        html,
        body {
          position: static;
          overflow-y: auto;
          overflow-x: hidden;
        }

        .main-viewport {
          height: auto;
          min-height: 100vh;
          overflow-y: auto;
          padding: 1rem;
        }

        .left-section {
          max-height: 52vh;
        }
      }

      /* Loading trên màn hình di động */
      @media (max-width: 480px) {
        .load-percent-number {
          font-size: 2.3rem;
        }

        .preloader-bar-track {
          max-width: 270px;
        }

        .preloader-status {
          font-size: 0.78rem;
          letter-spacing: 1.5px;
        }

        .loader-shapes-wrapper {
          transform: scale(0.85);
        }
      }

      /* ==========================================================================
         PRELOADER / MÀN HÌNH LOADING KIM LOẠI
         ========================================================================== */
      .preloader-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    visibility 0.8s;
      }

      .preloader-overlay.loaded {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.04);
        pointer-events: none;
      }

      .preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        max-width: 440px;
        width: 90%;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      /* ==========================================================================
         GEOMETRIC SHAPES PRELOADER (TRÒN - TAM GIÁC - VUÔNG VỚI CHẤM ĐỎ)
         ========================================================================== */
      .loader-shapes-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        margin-bottom: 0.8rem;
      }

      .loader {
        --path: #ffffff;
        --dot: #ff1744;
        --duration: 3s;
        width: 44px;
        height: 44px;
        position: relative;
        display: inline-block;
        margin: 0 8px;
      }

      /* Chấm đỏ phát quang chạy theo viền */
      .loader:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        position: absolute;
        display: block;
        background: var(--dot);
        top: 37px;
        left: 19px;
        transform: translate(-18px, -18px);
        box-shadow: 0 0 10px #ff1744, 0 0 18px #ff1744;
        animation: dotRect var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
      }

      .loader svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .loader svg rect,
      .loader svg polygon,
      .loader svg circle {
        fill: none;
        stroke: var(--path);
        stroke-width: 10px;
        stroke-linejoin: round;
        stroke-linecap: round;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
      }

      .loader svg polygon {
        stroke-dasharray: 145 76 145 76;
        stroke-dashoffset: 0;
        animation: pathTriangle var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
      }

      .loader svg rect {
        stroke-dasharray: 192 64 192 64;
        stroke-dashoffset: 0;
        animation: pathRect var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
      }

      .loader svg circle {
        stroke-dasharray: 150 50 150 50;
        stroke-dashoffset: 75;
        animation: pathCircle var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
      }

      .loader.triangle {
        width: 48px;
      }

      .loader.triangle:before {
        left: 21px;
        transform: translate(-10px, -18px);
        animation: dotTriangle var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
      }

      @keyframes pathTriangle {
        33% {
          stroke-dashoffset: 74;
        }
        66% {
          stroke-dashoffset: 147;
        }
        100% {
          stroke-dashoffset: 221;
        }
      }

      @keyframes dotTriangle {
        33% {
          transform: translate(0, 0);
        }
        66% {
          transform: translate(10px, -18px);
        }
        100% {
          transform: translate(-10px, -18px);
        }
      }

      @keyframes pathRect {
        25% {
          stroke-dashoffset: 64;
        }
        50% {
          stroke-dashoffset: 128;
        }
        75% {
          stroke-dashoffset: 192;
        }
        100% {
          stroke-dashoffset: 256;
        }
      }

      @keyframes dotRect {
        25% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(18px, -18px);
        }
        75% {
          transform: translate(0, -36px);
        }
        100% {
          transform: translate(-18px, -18px);
        }
      }

      @keyframes pathCircle {
        25% {
          stroke-dashoffset: 125;
        }
        50% {
          stroke-dashoffset: 175;
        }
        75% {
          stroke-dashoffset: 225;
        }
        100% {
          stroke-dashoffset: 275;
        }
      }

      /* Số phần trăm Chrome nổi khối */
      .preloader-counter {
        display: flex;
        align-items: baseline;
        justify-content: center;
      }

      .load-percent-number {
        font-family: var(--font-display);
        font-size: 2.8rem;
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
      }

      .load-percent-symbol {
        font-family: var(--font-display);
        font-size: 1.3rem;
        font-weight: 800;
        color: rgba(203, 213, 225, 0.85);
        margin-left: 2px;
      }

      /* Thanh tiến trình kim loại */
      .preloader-bar-track {
        width: 100%;
        max-width: 360px;
        height: 8px;
        background: #0f172a;
        border: 1px solid rgba(203, 213, 225, 0.35);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 12px rgba(226, 232, 240, 0.15);
      }

      .preloader-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #64748b 0%, #cbd5e1 45%, #ffffff 85%, #cbd5e1 100%);
        border-radius: 3px;
        position: relative;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.75);
        transition: width 0.1s linear;
      }

      .bar-sheen-light {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 30px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
        animation: bar-sheen-move 1.5s linear infinite;
      }

      @keyframes bar-sheen-move {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(360px); }
      }

      /* Dòng trạng thái nạp dữ liệu */
      .preloader-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        font-family: 'Rajdhani', var(--font-display);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 2px;
        color: #94a3b8;
        text-transform: uppercase;
      }

      .status-pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ff1744;
        box-shadow: 0 0 8px #ff1744, 0 0 14px #ff1744;
        animation: pulse-dot 1.2s ease-in-out infinite alternate;
      }

      @keyframes pulse-dot {
        0% { opacity: 0.3; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <!-- MÀN HÌNH PRELOADER / LOADING KIM LOẠI -->
    <div id="preloader" class="preloader-overlay">
      <div class="preloader-content">
        <!-- 3 Khối hình học Loading (Tròn - Tam Giác - Vuông với Chấm Đỏ) -->
        <div class="loader-shapes-wrapper">
          <div class="loader">
            <svg viewBox="0 0 80 80">
              <circle r="32" cy="40" cx="40" id="test"></circle>
            </svg>
          </div>
          <div class="loader triangle">
            <svg viewBox="0 0 86 80">
              <polygon points="43 8 79 72 7 72"></polygon>
            </svg>
          </div>
          <div class="loader">
            <svg viewBox="0 0 80 80">
              <rect height="64" width="64" y="8" x="8"></rect>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Tubes Cursor 3D Neon Ribbon Canvas -->
    <canvas id="tubes-cursor-canvas"></canvas>

    <!-- Lớp phủ điện ảnh chiều sâu -->
    <div class="screen-overlay"></div>

    <!-- BỐ CỤC 2 CỘT: TRÁI (CON AI 3D SPLINE TƯƠNG TÁC) - PHẢI (NÚT VÀO GAME ĐÊ CYBER) -->
    <main class="main-viewport">
      <!-- CỘT BÊN TRÁI: CON AI 3D TƯƠNG TÁC THEO CHUỘT LỆCH HẲN VỀ PHÍA TRÁI -->
      <section class="left-section">
        <div class="video-frame-container" id="videoContainer">
          <!-- Vầng hào quang ánh kim phía sau robot AI -->
          <div class="video-ambient-glow"></div>

          <!-- Khung chứa con AI 3D Spline tương tác -->
          <div class="ai-model-wrapper" id="aiModelWrapper">
            <spline-viewer
              id="aiSplineViewer"
              events-target="global"
              url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"
            ></spline-viewer>
          </div>
        </div>
      </section>

      <!-- CỘT BÊN PHẢI: NÚT BẤM "VÀO GAME ĐÊ" PHONG CÁCH CYBER HOLOGRAPHIC -->
      <section class="right-section">
        <div class="cta-container" id="ctaContainer">
          <!-- Hào quang Neon Cyan & sóng radar lan tỏa -->
          <div class="button-radar-ring"></div>
          <div class="button-ambient-wave"></div>

          <!-- NÚT BẤM "VÀO GAME ĐÊ" CYBER HOLOGRAPHIC -->
          <a
            href="https://tank-l1rl.onrender.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="cyber-game-btn"
            id="ctaButton"
          >
            <!-- Lớp viền phát quang Cyber Gradient -->
            <span class="btn-cyber-border"></span>

            <!-- Vệt sáng Laser Sheen khi hover -->
            <span class="btn-laser-sheen"></span>

            <!-- Đốm sáng Neon theo con trỏ chuột -->
            <span class="btn-cyber-spotlight" id="btnSpotlight"></span>

            <!-- Khối icon tay cầm game Cyberpunk -->
            <span class="btn-cyber-icon-box">
              <svg class="btn-cyber-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="2" y="6" width="20" height="12" rx="4" stroke-width="2" />
                <path d="M6 12h4m-2-2v4m7-2h.01m3 0h.01" stroke-width="2.2" stroke-linecap="round" />
              </svg>
            </span>

            <!-- Chữ "VÀO GAME ĐÊ" phát sáng Neon Cyan -->
            <span class="btn-cyber-label">VÀO GAME ĐÊ</span>

            <!-- Huy hiệu mũi tên chuyển động -->
            <span class="btn-arrow-badge">
              <svg class="btn-arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M5 12h14M12 5l7 7-7 7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
          </a>
        </div>
      </section>
    </main>

    <!-- ==========================================================================
       JAVASCRIPT: KINETIC GRID ENGINE + ÂM THANH KIM LOẠI + TƯƠNG TÁC CON AI
       ========================================================================== -->
    <script>
      /* --------------------------------------------------------------------------
       1. ÂM THANH TIẾNG KIM LOẠI / TIẾNG SẮT (WEB AUDIO API)
       -------------------------------------------------------------------------- */
      let audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Tiếng tuốt gươm thép / chrome loáng sắc lạnh khi hover
      function playMetalHoverSound() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;

          // Bộ dao động âm kim loại thanh mảnh tần số cao
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = "triangle";
          osc1.frequency.setValueAtTime(1400, ctx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(
            2600,
            ctx.currentTime + 0.14,
          );

          osc2.type = "sine";
          osc2.frequency.setValueAtTime(2800, ctx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(
            4200,
            ctx.currentTime + 0.12,
          );

          gain.gain.setValueAtTime(0.045, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start();
          osc2.start();
          osc1.stop(ctx.currentTime + 0.14);
          osc2.stop(ctx.currentTime + 0.14);
        } catch (e) {}
      }

      // Tiếng va đập thép nặng / búa dập cơ khí kim loại khi click
      function playMetalClickSound() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;

          // Tiếng gõ đanh thép (Clang)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "triangle";
          osc.frequency.setValueAtTime(420, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            80,
            ctx.currentTime + 0.28,
          );

          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);

          // Thêm tiếng vang kim loại
          const oscRing = ctx.createOscillator();
          const ringGain = ctx.createGain();
          oscRing.type = "sine";
          oscRing.frequency.setValueAtTime(1850, ctx.currentTime);
          oscRing.frequency.exponentialRampToValueAtTime(
            600,
            ctx.currentTime + 0.35,
          );

          ringGain.gain.setValueAtTime(0.06, ctx.currentTime);
          ringGain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.35,
          );

          osc.connect(gain);
          oscRing.connect(ringGain);
          gain.connect(ctx.destination);
          ringGain.connect(ctx.destination);

          osc.start();
          oscRing.start();
          osc.stop(ctx.currentTime + 0.28);
          oscRing.stop(ctx.currentTime + 0.35);
        } catch (e) {}
      }

      /* --------------------------------------------------------------------------
       2. TUBES CURSOR 3D NEON ENGINE (DẢI MÀU NEON 3D UỐN LƯỢN THEO CON TRỎ CHUỘT)
       -------------------------------------------------------------------------- */
      let tubesApp = null;

      const randomTubesColors = (count) => {
        return new Array(count)
          .fill(0)
          .map(() => "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0"));
      };

      function initTubesCursor() {
        const canvas = document.getElementById("tubes-cursor-canvas");
        if (!canvas) return;

        // Trì hoãn 100ms để đảm bảo DOM đã render kích thước canvas, tránh lỗi NaN bán kính hình học
        setTimeout(() => {
          import("https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js")
            .then((module) => {
              const TubesCursor = module.default;
              if (!canvas) return;

              tubesApp = TubesCursor(canvas, {
                tubes: {
                  colors: ["#5e72e4", "#8965e0", "#f5365c"],
                  lights: {
                    intensity: 200,
                    colors: ["#21d4fd", "#b721ff", "#f4d03f", "#11cdef"],
                  },
                },
              });
            })
            .catch((err) => {
              console.error("Lỗi khi tải module TubesCursor:", err);
            });
        }, 100);
      }

      // Nhấp chuột vào bất kỳ đâu trên trang để đổi màu dải neon ngẫu nhiên
      window.addEventListener("click", () => {
        if (tubesApp && tubesApp.tubes) {
          tubesApp.tubes.setColors(randomTubesColors(3));
          tubesApp.tubes.setLightsColors(randomTubesColors(4));
        }
      });


      /* --------------------------------------------------------------------------
       XÓA BỎ HOÀN TOÀN WATERMARK "BUILT WITH SPLINE"
       -------------------------------------------------------------------------- */
      function removeSplineBadge() {
        const viewer = document.getElementById("aiSplineViewer");
        if (!viewer) return;

        let obsAttached = false;
        const purge = () => {
          try {
            const root = viewer.shadowRoot;
            if (root) {
              if (!obsAttached) {
                const obs = new MutationObserver(purge);
                obs.observe(root, { childList: true, subtree: true });
                obsAttached = true;
              }
              if (!root.getElementById("spline-no-badge-style")) {
                const style = document.createElement("style");
                style.id = "spline-no-badge-style";
                style.textContent = `
                  #logo, a#logo, [href*="spline.design"], a[href*="spline"], 
                  .spline-watermark, #badge, [class*="watermark"], [class*="logo"] {
                    display: none !important;
                    opacity: 0 !important;
                    visibility: hidden !important;
                    pointer-events: none !important;
                    clip: rect(0, 0, 0, 0) !important;
                    position: absolute !important;
                    left: -9999px !important;
                    transform: scale(0) !important;
                  }
                `;
                root.appendChild(style);
              }
              const logo = root.querySelector('#logo, a[href*="spline.design"], .spline-watermark, [id*="logo"]');
              if (logo) logo.remove();
            }
          } catch (e) {}
        };

        purge();
        const timer = setInterval(purge, 50);
        setTimeout(() => clearInterval(timer), 8000);
      }

      /* --------------------------------------------------------------------------
       3. PRELOADER & NẠP CON AI 3D SPLINE TƯƠNG TÁC
       -------------------------------------------------------------------------- */
      const splineViewer = document.getElementById("aiSplineViewer");
      const preloader = document.getElementById("preloader");

      let isLoaded = false;

      function finishLoading() {
        if (isLoaded) return;
        isLoaded = true;

        if (preloader) {
          preloader.classList.add("loaded");
          setTimeout(() => {
            try { preloader.remove(); } catch (e) {}
          }, 850);
        }
      }

      // Khi mô hình 3D Spline tải xong
      if (splineViewer) {
        splineViewer.addEventListener("load", () => {
          removeSplineBadge();
          try {
            if (splineViewer._spline) {
              if (typeof splineViewer._spline.setGlobalEvents === "function") {
                splineViewer._spline.setGlobalEvents(true);
              } else if (splineViewer._spline.eventManager) {
                splineViewer._spline.eventManager.updateUseWindowEvents(true);
              }
            }
          } catch (e) {}
          // Đợi 1.2s để người dùng thấy animation các khối hình học rồi vào web
          setTimeout(finishLoading, 1200);
        });
      }

      // Tối đa 2.5s tự động mở vào trang web chính
      setTimeout(finishLoading, 2500);

      // Kích hoạt Audio Context khi người dùng tương tác lần đầu
      const initAudioOnInteraction = () => {
        getAudioContext();
        window.removeEventListener("pointerdown", initAudioOnInteraction);
        window.removeEventListener("touchstart", initAudioOnInteraction);
        window.removeEventListener("click", initAudioOnInteraction);
      };
      window.addEventListener("pointerdown", initAudioOnInteraction, { once: true });
      window.addEventListener("touchstart", initAudioOnInteraction, { once: true });
      window.addEventListener("click", initAudioOnInteraction, { once: true });

      /* --------------------------------------------------------------------------
       4. NÚT BẤM "VÀO GAME ĐÊ" VẬT LÝ KIM LOẠI & LỰC HÚT MAGNETIC
       -------------------------------------------------------------------------- */
      const ctaButton = document.getElementById("ctaButton");
      const btnSpotlight = document.getElementById("btnSpotlight");

      if (ctaButton) {
        ctaButton.addEventListener("mouseenter", () => {
          playMetalHoverSound();
        });

        ctaButton.addEventListener("click", (e) => {
          playMetalClickSound();

          // Hiệu ứng sóng xung kích bạc khi đập vào nút thép
          const rect = ctaButton.getBoundingClientRect();
          const diameter = Math.max(rect.width, rect.height) * 1.5;
          const radius = diameter / 2;

          const ripple = document.createElement("span");
          ripple.className = "btn-click-ripple";
          ripple.style.width = ripple.style.height = `${diameter}px`;
          ripple.style.left = `${e.clientX - rect.left - radius}px`;
          ripple.style.top = `${e.clientY - rect.top - radius}px`;

          const existingRipple = ctaButton.querySelector(".btn-click-ripple");
          if (existingRipple) existingRipple.remove();

          ctaButton.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        });

        // Lực hút magnetic pull & di chuyển spotlight kim loại
        ctaButton.addEventListener("mousemove", (e) => {
          const rect = ctaButton.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          ctaButton.style.setProperty("--mouse-x", `${x}px`);
          ctaButton.style.setProperty("--mouse-y", `${y}px`);

          if (window.innerWidth > 991) {
            const moveX = (x - rect.width / 2) * 0.28;
            const moveY = (y - rect.height / 2) * 0.28;
            ctaButton.style.transform = `translate3d(${moveX}px, ${moveY - 3}px, 0) scale(1.03)`;
          }
        });

        ctaButton.addEventListener("mouseleave", () => {
          ctaButton.style.transform = "translate3d(0, 0, 0) scale(1)";
        });
      }

      // Khởi chạy khi DOM sẵn sàng
      window.addEventListener("DOMContentLoaded", () => {
        initTubesCursor();
        removeSplineBadge();
      });
    </script>
  </body>
